  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; letter-spacing: 0.2px; }
    .glass-card { background: rgba(255, 255, 255, 0.95); border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); border: 1px solid rgba(255, 255, 255, 0.3); }
    .input-field { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #e5e7eb; background: #f9fafb; margin-top: 4px; outline: none; transition: all 0.2s; }
    .input-field:focus { border-color: #E35205; box-shadow: 0 0 0 2px rgba(227, 82, 5, 0.2); }
    .input-error { border-color: #ef4444 !important; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2) !important; background-color: #fef2f2 !important; }
    .btn { width: 100%; padding: 12px; border-radius: 12px; font-weight: 500; text-align: center; cursor: pointer; border: none; display: flex; justify-content: center; align-items: center; gap: 0.5rem; font-size: 14px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 10000; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { min-width: 250px; padding: 1rem; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: flex-start; gap: 0.75rem; background: white; border-left: 4px solid transparent; animation: slideInRight 0.3s cubic-bezier(0.4,0,0.2,1) forwards;}
    .toast.success { border-left-color: #10b981; } .toast.warning { border-left-color: #f59e0b; } .toast.error { border-left-color: #ef4444; }
    .toast.closing { animation: slideOutRight 0.3s cubic-bezier(0.4,0,0.2,1) forwards; }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    
    .loading-active { overflow: hidden; }
  </style>
</head>

      <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-[#E35205] mb-4"></div>

  </div>
  <div id="toast-container" class="toast-container"></div>

  <script>
    const CURRENT_VERSION = "20260627.02";
    async function checkAppVersion() {
        try {
            const res = await fetch('version.json?t=' + Date.now());
            if (!res.ok) return true;
            const config = await res.json();
            if (config && config.version && config.version !== CURRENT_VERSION) {
                alert('พบเวอร์ชันใหม่ กำลังอัปเดตระบบ...');
                const url = new URL(window.location.href);
                url.searchParams.set('update', Date.now());
                window.location.replace(url.toString());
                return false;
            }
        } catch (e) {
            console.warn('Version check skipped:', e);
        }
        return true;
    }

    /* ===== AKRA Global Version Guard (shared inline, Conductor plan 20260611-003) =====
       Watches version.json after load (interval/focus/visibility/pageshow). On mismatch it
       shows a non-blocking reload banner; a blocking modal + abort only fires before a
       mutation via blockIfStale(). Reads listed in readActions stay allowed. */
    const AppVersionGuard = (function () {
        var cfg = { current: '', readActions: [] };
        var stale = false, started = false;
        var POLL_MS = 5 * 60 * 1000;

        function reload() {
            var url = new URL(window.location.href);
            url.searchParams.set('update', Date.now());
            window.location.replace(url.toString());
        }
        function injectStyles() {
            if (document.getElementById('avg-style')) return;
            var s = document.createElement('style');
            s.id = 'avg-style';
            s.textContent = '#avg-banner{position:fixed;top:0;left:0;right:0;z-index:2147483646;background:#E35205;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}#avg-banner button{cursor:pointer;border:0;border-radius:8px;font-weight:700;padding:8px 16px;background:#fff;color:#E35205}#avg-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}#avg-modal .avg-card{background:#fff;color:#1f2937;max-width:380px;width:100%;border-radius:16px;padding:24px;text-align:center;font:400 15px/1.5 system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.3)}#avg-modal .avg-card h2{font-size:18px;font-weight:800;margin:0 0 8px}#avg-modal .avg-card button{cursor:pointer;border:0;margin-top:16px;background:#E35205;color:#fff;width:100%;padding:12px;border-radius:8px;font-weight:700}';
            document.head.appendChild(s);
        }
        function showBanner() {
            injectStyles();
            if (document.getElementById('avg-banner')) return;
            var bar = document.createElement('div');
            bar.id = 'avg-banner';
            bar.setAttribute('role', 'status');
            bar.setAttribute('aria-live', 'polite');
            var msg = document.createElement('span');
            msg.textContent = 'มีเวอร์ชันใหม่ของระบบ กรุณารีโหลดเพื่ออัปเดต';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = 'รีโหลด';
            btn.addEventListener('click', reload);
            bar.appendChild(msg);
            bar.appendChild(btn);
            document.body.appendChild(bar);
        }
        function showModal() {
            injectStyles();
            var existing = document.getElementById('avg-modal');
            if (existing) { existing.querySelector('button').focus(); return; }
            var m = document.createElement('div');
            m.id = 'avg-modal';
            m.setAttribute('role', 'alertdialog');
            m.setAttribute('aria-modal', 'true');
            m.setAttribute('aria-labelledby', 'avg-modal-title');
            var card = document.createElement('div');
            card.className = 'avg-card';
            var h = document.createElement('h2');
            h.id = 'avg-modal-title';
            h.textContent = 'ต้องอัปเดตระบบ';
            var p = document.createElement('div');
            p.setAttribute('aria-live', 'assertive');
            p.textContent = 'พบเวอร์ชันใหม่ ไม่สามารถบันทึกจากหน้าเดิมได้ กรุณารีโหลดก่อนทำรายการ';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = 'รีโหลดเดี๋ยวนี้';
            btn.addEventListener('click', reload);
            card.appendChild(h);
            card.appendChild(p);
            card.appendChild(btn);
            m.appendChild(card);
            document.body.appendChild(m);
            btn.focus();
        }
        async function fetchRemote() {
            try {
                var res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) return null;
                var c = await res.json();
                return (c && c.version) ? String(c.version) : null;
            } catch (e) { console.warn('Version check skipped:', e); return null; }
        }
        function markStale() {
            if (stale) return;
            stale = true;
            showBanner();
        }
        async function check() {
            if (stale) return false;
            var remote = await fetchRemote();
            if (remote && remote !== cfg.current) { markStale(); return false; }
            return true;
        }
        // Returns true when the caller's mutation should be BLOCKED. Awaits a fresh check
        // right before a save to close the polling race window (see plan Risk note).
        async function blockIfStale(action) {
            if (action && cfg.readActions.indexOf(action) !== -1) return false;
            if (!stale) await check();
            if (!stale) return false;
            showModal();
            return true;
        }
        function start(options) {
            cfg.current = options.current;
            cfg.readActions = options.readActions || [];
            if (started) return;
            started = true;
            setInterval(check, POLL_MS);
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') check();
            });
            window.addEventListener('focus', check);
            window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
        }
        return { start: start, check: check, blockIfStale: blockIfStale, isStale: function () { return stale; }, reloadNow: reload };
    })();

    var APP_CONFIG = {
        API_URL: "https://script.google.com/macros/s/AKfycbyQJLwb5HTexG6gxqTehGWlAxfSXVT--CpWnnp2JTcP4xCcMA1vUjSY_eWqPjUKwzq7/exec",
        PORTAL_URL: "https://akra-web.github.io/Main/", 
        REQUIRED_ROLES: ["ADMIN", "SUPERVISOR", "AKRA", "WAREHOUSE"],
        APP_NAME: "ระบบรับสินค้า (GR)",
        STORAGE_KEY: "akra_gr_session"
    };

    var DATA_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzN9bIC6gxWGMR4tbj96E0yzWbHrrZ9NeYLtJR_Al7mRW_4L_sALC1rU4nCizVn3I/exec";
    
    var appData = { products: [], pendingPOs: [] };
    var groupedPOs = [];
    var currentActiveGroup = null;
    var poListRenderTimer = null;
    var grCompletedLoaded = false;
    var receivingMutationInFlight = false;
    var deliveryPlanFilter = '';
    var deliveryPlanDayOffset = null;
    var isDeliveryPlanVisible = true;
    var GR_WAREHOUSES = ['W1', 'W2', 'W3', 'W4', 'W5', 'C1', 'C2'];

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    var UI = {
        showLoading: () => { document.body.classList.add('loading-active'); document.getElementById('auth-loading').classList.remove('hidden'); document.getElementById('auth-error').classList.add('hidden'); document.getElementById('app-content').classList.add('hidden'); },
        showError: (message) => { document.body.classList.remove('loading-active'); document.getElementById('auth-loading').classList.add('hidden'); const errorSection = document.getElementById('auth-error'); errorSection.classList.remove('hidden'); document.getElementById('error-message').innerText = message; },
        showApp: (username) => { document.body.classList.remove('loading-active'); document.getElementById('auth-loading').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); document.getElementById('display-username').innerText = username; }
    };

    function normalizeRole(role) {
        return String(role || '').trim().toUpperCase();
    }

    function normalizeRoles(roles) {
        if (Array.isArray(roles)) return roles.map(normalizeRole).filter(Boolean);
        if (roles === null || roles === undefined) return [];
        return String(roles).split(',').map(normalizeRole).filter(Boolean);
    }

    function getGrPerms(session) {
        return ((session && session.perms && session.perms["app-gr"]) || []).map(String);
    }

    function buildAppSession(user) {
        return {
            name: user.name,
            id: user.id,
            roles: normalizeRoles(user.roles),

                    window.history.replaceState({}, document.title, window.location.pathname);

                    const verifyURL = `${APP_CONFIG.API_URL}?action=verifyToken&token=${encodeURIComponent(fixedSsoToken)}`;

    // Canonical location string format: WH-<floor>F[-zone], e.g. W2-2F-2-1 (zone optional, may contain dashes).
    function serializeLoc(wh, floor, zone) {
        wh = (wh || '').trim();
        floor = (floor === null || floor === undefined) ? '' : String(floor).trim();
        zone = (zone || '').trim();
        if (!wh) return zone; // legacy fallback: nothing structured
        var parts = [wh];
        if (floor) parts.push(floor + 'F');
        if (zone) parts.push(zone);
        return parts.join('-');
    }
    function parseLoc(str) {
        str = (str || '').trim();
        if (!str) return { wh: '', floor: '', zone: '' };
        var m = str.match(/^(W[1-5]|C[12])-([1-5])F(?:-(.*))?$/);
        if (m) return { wh: m[1], floor: m[2], zone: m[3] || '' };
        return { wh: '', floor: '', zone: str }; // legacy free-text preserved in zone
    }

        }

    function parseReceivingRemark(remark) {
        var text = String(remark || '');
        var parsed = { note: text.trim(), liftRounds: '', liftPayment: '' };
        var matchNew = text.match(/\[ค่าลิฟท์\s*(\d+)?\s*รอบ\s*(จ่ายสด|เชื่อ)\]\s*/);
        if (matchNew) {
            parsed.liftRounds = matchNew[1] || '';
            parsed.liftPayment = matchNew[2] || '';
            parsed.note = text.replace(matchNew[0], '').trim();
            return parsed;
        }
        var matchOld = text.match(/\[ค่าลิฟท์:\s*(จ่ายสด|เชื่อ)\]\s*/);
        if (matchOld) {
            parsed.liftPayment = matchOld[1] || '';
            parsed.note = text.replace(matchOld[0], '').trim();
        }
        return parsed;
    }

    async function apiCall(action, payload = null) {
      if (await AppVersionGuard.blockIfStale(action)) return { success: false, error: 'พบเวอร์ชันใหม่ กรุณารีโหลดก่อนทำรายการ' };
      if (!navigator.onLine) return { success: false, message: 'Offline' };
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);
      try {
        const res = await fetch(DATA_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, data: payload }), signal: controller.signal });
        clearTimeout(timeoutId);
        return await res.json();
      } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') return { success: false, error: 'หมดเวลาเชื่อมต่อ (timeout 30s) กรุณาลองใหม่' };
        return { success: false, error: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้' };
      }
    }

        if (cachedData && !isManualRefresh) {

                groupPendingPOs();

        } else {
            showDataLoading('กำลังโหลดข้อมูลรอรับเข้า...');
        }

        const response = await apiCall('getInitialData', { includeCompleted: false, includeProducts: false });

        if (!cachedData || isManualRefresh) hideDataLoading();

        if (response.success) {

        } else if (!cachedData) {
            showNotification('ดึงข้อมูลไม่สำเร็จ', 'error');
        }
    }

    function groupPendingPOs() {
      const groups = {};
      const allPOs = [
        ...(appData.pendingPOs || []),
        ...(appData.grCompleted || [])
      ];
      allPOs.forEach(po => {
        const key = poBillGroupKey(po, '|' + (po.status || ''));
        if (!groups[key]) {
            groups[key] = {
                refPrUid: usableBillRefUid(po.refPrUid),
                poNumber: po.poNumber,
                vendor: po.vendor,
                poDate: po.poDate,
                warehouse: po.warehouse,
                status: po.status,
                expectedDate: po.expectedDate || '',
                plannedDate: po.plannedDate || '',
                planSource: po.planSource || 'no_data',
                daysUntil: (po.daysUntil === null || po.daysUntil === undefined) ? null : Number(po.daysUntil),
                isPlanOverdue: !!po.isPlanOverdue,
                vendorAvgLeadDays: po.vendorAvgLeadDays || '',
                vendorP75LeadDays: po.vendorP75LeadDays || '',
                vendorLeadSampleCount: po.vendorLeadSampleCount || 0,
                vendorLeadConfidence: po.vendorLeadConfidence || 'none',
                confirmedCount: 0,
                confirmedDate: '',
                confirmedDaysUntil: null,
                estimatedDate: '',
                estimatedDaysUntil: null,
                items: []
            };
        }
        const poDays = (po.daysUntil === null || po.daysUntil === undefined || po.daysUntil === '') ? null : Number(po.daysUntil);
        if (po.planSource === 'confirmed' && po.expectedDate) {
            groups[key].confirmedCount++;
            if (groups[key].confirmedDaysUntil === null || (poDays !== null && poDays < groups[key].confirmedDaysUntil)) {
                groups[key].confirmedDaysUntil = poDays;
                groups[key].confirmedDate = po.expectedDate;
            }
        } else if (po.plannedDate) {
            if (groups[key].estimatedDaysUntil === null || (poDays !== null && poDays < groups[key].estimatedDaysUntil)) {
                groups[key].estimatedDaysUntil = poDays;
                groups[key].estimatedDate = po.plannedDate;
            }
        }
        if (po.isPlanOverdue) groups[key].isPlanOverdue = true;
        groups[key].items.push(po);
      });
      // Finalize bill-level plan: a single confirmed item must not paint the whole bill confirmed.
      Object.values(groups).forEach(g => {
        const total = g.items.length;
        g.confirmedItemCount = g.confirmedCount;
        g.totalItemCount = total;
        if (g.confirmedCount > 0) {
            g.expectedDate = g.confirmedDate;
            g.plannedDate = g.confirmedDate;
            g.daysUntil = g.confirmedDaysUntil;
            g.planSource = (g.confirmedCount >= total) ? 'confirmed' : 'partial';
        } else if (g.estimatedDate) {
            g.plannedDate = g.estimatedDate;
            g.daysUntil = g.estimatedDaysUntil;
            g.planSource = 'estimated_p75';
        } else {
            g.planSource = 'no_data';
        }
      });
      groupedPOs = Object.values(groups).sort((a, b) => {
        let getScore = (group) => {
            if (group.isPlanOverdue && group.status === 'Pending GR') return 6;
            if (group.items.some(i => i.displayStatus === 'Overdue')) return 5;
            if (group.status === 'Pending Review') return 4;
            if (group.status === 'Draft GR') return 3;
            if (group.status === 'Pending GR') return 2;
            return 1;
        };
        var scoreDiff = getScore(b) - getScore(a);
        if (scoreDiff) return scoreDiff;
        if (a.daysUntil === null && b.daysUntil !== null) return 1;
        if (a.daysUntil !== null && b.daysUntil === null) return -1;
        if (a.daysUntil !== null && b.daysUntil !== null) return a.daysUntil - b.daysUntil;
        return 0;
      });
      groupedPOs.forEach((group, index) => {
          group.index = index;
          group.searchText = `${group.vendor || ''} ${group.poNumber || ''} ${group.items.map(item => item.product || '').join(' ')}`.toLowerCase();
      });
    }

    function setInputDisabledStatus(disabled) {
        document.querySelectorAll('.po-item-row input').forEach(input => {
            if (input.classList.contains('po-qty') || input.classList.contains('po-exp') || input.classList.contains('po-old-stock') || input.classList.contains('po-loc-zone') || input.classList.contains('po-qty2') || input.classList.contains('po-loc-zone2')) {
                input.disabled = disabled;
                if (disabled) {
                    input.classList.add('bg-gray-100', 'cursor-not-allowed');
                } else {
                    input.classList.remove('bg-gray-100', 'cursor-not-allowed');
                }
            }
        });
        document.querySelectorAll('.po-item-row select, .po-item-row .po-split-btn').forEach(el => {
            el.disabled = disabled;
            if (disabled) { el.classList.add('bg-gray-100', 'cursor-not-allowed', 'opacity-60'); }
            else { el.classList.remove('bg-gray-100', 'cursor-not-allowed', 'opacity-60'); }
        });

        document.getElementById('r-ata').disabled = disabled;
        document.getElementById('r-receiver').disabled = disabled;
        document.getElementById('r-remark').disabled = disabled;
        
        const addExtraBtn = document.querySelector('button[onclick="addExtraItemRow()"]');
        if (addExtraBtn) {
            addExtraBtn.disabled = disabled;
            if (disabled) addExtraBtn.classList.add('opacity-50', 'cursor-not-allowed');
            else addExtraBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
        
        document.querySelectorAll('.extra-item-row input, .extra-item-row button').forEach(el => {
            el.disabled = disabled;
            if (disabled) el.classList.add('opacity-50', 'cursor-not-allowed');
            else el.classList.remove('opacity-50', 'cursor-not-allowed');
        });
    }

    async function handleRecallOrReset(actionType) {
        if (receivingMutationInFlight) return;
        const actionLabel = actionType === 'reset' ? 'รีเซ็ตสถานะเป็นรอรับเข้า (ล้างข้อมูลรับสินค้าทั้งหมด)' : 'ดึงบิลกลับมาแก้ไข (ย้อนสถานะกลับเป็นฉบับร่าง)';
        const confirmMsg = `คุณแน่ใจหรือไม่ว่าต้องการ ${actionLabel} สำหรับบิลนี้?`;
        
        if (!confirm(confirmMsg)) return;

        const index = document.getElementById('r-group-index').value;
        const group = currentActiveGroup || groupedPOs[index];
        if (!group) return showNotification("ไม่พบข้อมูลกลุ่มสินค้า", "error");

        const poUids = itemUids(loadedBillItems(group));
        if (poUids.length === 0) return showNotification("ไม่พบ UID ของรายการในบิลนี้ กรุณารีเฟรชข้อมูล", "error");

        receivingMutationInFlight = true;
        try {
            showDataLoading(`กำลังดำเนินการ...`);

            const res = await apiCall('recallGR', { poUids, actionType });
            hideDataLoading();

            if (res.success) {
                clearReceivingCaches();
                showNotification(res.message, "success");
                showView('receiving-list-view');
                await openReceiving(true); // Force manual refresh to reload lists and cache
            } else {
                showNotification("เกิดข้อผิดพลาด: " + (res.message || res.error || ''), "error");
            }
        } finally {
            receivingMutationInFlight = false;
            hideDataLoading();
        }
    }

    function setupAutocomplete(inputEl) {
        const suggestionBox = inputEl.nextElementSibling.nextElementSibling;
        inputEl.addEventListener('input', function() {
            const val = this.value.trim().toLowerCase(); suggestionBox.innerHTML = '';
            if (!val || !appData.products || appData.products.length === 0) { suggestionBox.classList.add('hidden'); return; }
            const filtered = appData.products.filter(p => p.name.toLowerCase().includes(val)).slice(0, 15);
            if (filtered.length === 0) { suggestionBox.classList.add('hidden'); return; }
            
            filtered.forEach(p => {
                const li = document.createElement('li'); li.className = 'px-3 py-2 hover:bg-orange-50 cursor-pointer text-sm font-medium text-gray-700 flex justify-between';
                li.innerHTML = `<span>${p.name}</span> <span class="text-[10px] text-gray-400">${p.unit}</span>`;
                li.onmousedown = function(e) {
                    e.preventDefault(); inputEl.value = p.name;
                    const row = inputEl.closest('.extra-item-row');
                    row.querySelector('.ex-sku').value = p.sku || ''; 
                    row.querySelector('.ex-unit').value = p.unit || ''; 
                    row.querySelector('.ex-qty').focus();
                    suggestionBox.classList.add('hidden');
                };
                suggestionBox.appendChild(li);
            });
            suggestionBox.classList.remove('hidden');
        });
        inputEl.addEventListener('blur', () => setTimeout(() => suggestionBox.classList.add('hidden'), 200));
        inputEl.addEventListener('focus', function() { if (this.value && suggestionBox.children.length > 0) suggestionBox.classList.remove('hidden'); });
    }

    async function submitReceiving(e, targetStatus) {
      e.preventDefault();
      const isDraft = targetStatus === 'Draft GR';
      
      const ataInput = document.getElementById('r-ata'); const receiverInput = document.getElementById('r-receiver');
      ataInput.classList.remove('input-error'); receiverInput.classList.remove('input-error');

      const ata = ataInput.value; const receiverName = receiverInput.value.trim(); 
      let remark = document.getElementById('r-remark').value.trim();
      
      const liftFeeContainer = document.getElementById('lift-fee-container');
      if (liftFeeContainer) {
          const selectedLiftFee = document.querySelector('input[name="lift-fee"]:checked');
          const liftRounds = document.getElementById('lift-fee-rounds').value.trim();
          const rounds = parseInt(liftRounds);
          
          if (selectedLiftFee && !isNaN(rounds) && rounds > 0) {
              remark = `[ค่าลิฟท์ ${rounds} รอบ ${selectedLiftFee.value}] ` + remark;
          }
      }

      // ถ้าเป็น Pending Review หรือ GR Completed ต้องบังคับกรอกข้อมูลพื้นฐานให้ครบ
      if (!isDraft && (!ata || !receiverName)) {
          if(!ata) ataInput.classList.add('input-error'); if(!receiverName) receiverInput.classList.add('input-error');
          return showNotification("กรุณาระบุวันที่รับและชื่อผู้รับให้ครบถ้วนก่อนยืนยัน", "warning");
      }

      const index = document.getElementById('r-group-index').value; 
      const group = currentActiveGroup || groupedPOs[index];
      if (!group) return showNotification("ไม่พบข้อมูลกลุ่มสินค้า กรุณาลองใหม่อีกครั้ง", "error");
      let formHasError = false;

      const poItemsData = [];
      const splitNotes = [];
      document.querySelectorAll('.po-item-row').forEach(row => {
          const rowNum = row.dataset.rownum;
          const uid = row.dataset.uid;
          const qtyInput = row.querySelector('.po-qty');
          const whSel = row.querySelector('.po-loc-wh'); const floorSel = row.querySelector('.po-loc-floor'); const zoneInp = row.querySelector('.po-loc-zone');
          qtyInput.classList.remove('input-error'); floorSel.classList.remove('input-error');

          const unit = row.querySelector('.po-unit').value.trim(); const exp = row.querySelector('.po-exp').value.trim();
          const oldStockInput = row.querySelector('.po-old-stock'); const oldStock = oldStockInput ? oldStockInput.value.trim() : '';

          let grQty = qtyInput.value.trim();
          let locIn = serializeLoc(whSel.value, floorSel.value, zoneInp.value);

          const splitWrap = row.querySelector('.po-split');
          const splitOn = splitWrap && !splitWrap.classList.contains('hidden');
          const floor2El = row.querySelector('.po-loc-floor2');
          if (floor2El) floor2El.classList.remove('input-error');
          let splitActive = false;

          if (splitOn) {
              const wh2 = row.querySelector('.po-loc-wh2'); const zone2 = row.querySelector('.po-loc-zone2'); const qty2Inp = row.querySelector('.po-qty2');
              const q2 = parseFloat(qty2Inp.value) || 0;
              if (q2 > 0) {
                  splitActive = true;
                  const q1 = parseFloat(grQty) || 0;
                  grQty = String(q1 + q2);
                  locIn = locIn + ' | ' + serializeLoc(wh2.value, floor2El.value, zone2.value);
                  const meta = group.items.find(it => String(it.uid) === String(uid)) || {};
                  splitNotes.push(`[${meta.product || ''}] ลง ${whSel.value}-${q1} ${unit} / ${wh2.value}-${q2} ${unit}`);
              }
          }

          if (grQty && parseFloat(grQty) > 0) {
              if (!isDraft && !floorSel.value) { floorSel.classList.add('input-error'); formHasError = true; }
              if (!isDraft && splitActive && !floor2El.value) { floor2El.classList.add('input-error'); formHasError = true; }
              poItemsData.push({ rowNumber: rowNum, uid: uid, grQty, unit, locIn, exp, oldStock });
          } else if (isDraft) {
              poItemsData.push({ rowNumber: rowNum, uid: uid, grQty: "", unit, locIn, exp, oldStock });
          }
      });

      const extraItemsData = [];
      document.querySelectorAll('.extra-item-row').forEach(row => {
          const pInput = row.querySelector('.ex-product'); const qInput = row.querySelector('.ex-qty');
          const whSel = row.querySelector('.ex-loc-wh'); const floorSel = row.querySelector('.ex-loc-floor'); const zoneInp = row.querySelector('.ex-loc-zone');
          pInput.classList.remove('input-error'); qInput.classList.remove('input-error'); floorSel.classList.remove('input-error');

          const sku = row.querySelector('.ex-sku') ? row.querySelector('.ex-sku').value.trim() : '';
          const product = pInput.value.trim(); const grQty = qInput.value.trim();
          const locIn = serializeLoc(whSel.value, floorSel.value, zoneInp.value);
          const unit = row.querySelector('.ex-unit').value.trim(); const exp = row.querySelector('.ex-exp').value.trim();
          const oldStockInput = row.querySelector('.ex-old-stock'); const oldStock = oldStockInput ? oldStockInput.value.trim() : '';

          if (product || grQty) {
              if (!product) { pInput.classList.add('input-error'); formHasError = true; }
              if (!grQty) { qInput.classList.add('input-error'); formHasError = true; }
              if (!isDraft && !floorSel.value) { floorSel.classList.add('input-error'); formHasError = true; }
              if (product && grQty) extraItemsData.push({ sku, product, grQty, unit, locIn, exp, oldStock });
          }
      });

      if (formHasError) return showNotification("กรุณากรอกข้อมูลโลเคชั่น หรือข้อมูลของแถมให้ครบถ้วน", "warning");
      const totalReceived = poItemsData.filter(i => i.grQty && parseFloat(i.grQty) > 0).length + extraItemsData.length;
      if (!isDraft && totalReceived === 0) return showNotification("โปรดใส่จำนวนรับสินค้าอย่างน้อย 1 รายการ", "warning");

      let finalRemark = remark.trim();
      if (splitNotes.length) finalRemark = (finalRemark ? finalRemark + ' ' : '') + splitNotes.join(' | ');

      const bulkPayload = {
          ata: Utilities_formatDateFrontEnd(ata), receiverName: receiverName, remark: finalRemark, targetStatus: targetStatus,
          groupInfo: { poDate: group.poDate, vendor: group.vendor, poNumber: group.poNumber, warehouse: group.warehouse },
          groupPoUids: itemUids(group.items),
          items: poItemsData, extraItems: extraItemsData
      };

      let btnId = 'btn-draft';
      if(targetStatus === 'Pending Review') btnId = 'btn-review';
      else if(targetStatus === 'GR Completed') btnId = 'btn-confirm-receive';

      document.getElementById(btnId).disabled = true; showDataLoading(`กำลังบันทึกข้อมูลเข้าคลัง...`);

      const res = await apiCall('bulkReceivePO', bulkPayload);
      
      document.getElementById(btnId).disabled = false; 
      hideDataLoading();
      
      if(res.success) { 
          let msg = "บันทึกสำเร็จ!";
          if(targetStatus === 'Draft GR') msg = "พักบิล (Draft) เรียบร้อย";
          else if(targetStatus === 'Pending Review') msg = "ส่งให้ตรวจสอบเรียบร้อยแล้ว!";
          else msg = "ยืนยันรับสินค้าเข้าคลังสมบูรณ์!";
          
          showNotification(msg, "success"); 
          showView('receiving-list-view');
          clearReceivingCaches();
          
          openReceivingInBackground(); 
      } 
      else { showNotification("เกิดข้อผิดพลาด: " + res.message, "error"); }
    }

    async function openReceivingInBackground() {
        try {
            const response = await apiCall('getInitialData', { includeCompleted: false, includeProducts: false });
            if (response.success) {
                setCache('CACHE_GR_ACTIVE_DATA_V2', response);
                const prevProducts = appData.products;
                appData = response;
                appData.products = prevProducts || [];
                grCompletedLoaded = false;
                groupPendingPOs();
                renderPOListForReceiving();
            }
        } catch(e) {}
    }

    function parseDateToInput(ddmmyyyy) { if(!ddmmyyyy) return ''; const p = ddmmyyyy.split('/'); if(p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`; return ddmmyyyy; }
    function Utilities_formatDateFrontEnd(dateStr) { if(!dateStr) return ''; const p = dateStr.split('-'); if(p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`; return dateStr; }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH'; 
            utterance.rate = 0.9; 
            
            const voices = window.speechSynthesis.getVoices();
            const thaiVoice = voices.find(voice => voice.lang.includes('th'));
            if (thaiVoice) utterance.voice = thaiVoice;

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification('เบราว์เซอร์หรืออุปกรณ์ของคุณไม่รองรับการอ่านออกเสียง', 'warning');
        }
    }

    function readAllPOItems() {
        const index = document.getElementById('r-group-index').value;
        const group = currentActiveGroup || groupedPOs[index];
        if (!group) return;
        
        let fullText = "รายการสินค้าที่ต้องรับ มีดังนี้. ";
        const showOrderedQuantity = canViewOrderedQuantity();
        group.items.forEach((item, i) => {
            fullText += showOrderedQuantity
                ? `รายการที่ ${i+1}. ${item.product} จำนวน ${item.quantity} ${item.unit || ''}. `
                : `รายการที่ ${i+1}. ${item.product}. `;
        });
        
        speakText(fullText);
    }
  </script>
</body>
</html>
